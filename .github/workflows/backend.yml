name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check syntax (py compile)
        working-directory: backend
        run: python -m py_compile server.py && echo "✅ server.py syntax OK"

      - name: Verify FastAPI app loads
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: nearvita_ci
          JWT_SECRET: ci_test_secret_for_actions_only
          CORS_ORIGINS: http://localhost:3000
          FRONTEND_URL: http://localhost:3000
          ADMIN_EMAIL: admin@nearvita.health
          ADMIN_PASSWORD: Admin@1234
        run: python -c "from server import app; print('FastAPI app loaded OK')"
